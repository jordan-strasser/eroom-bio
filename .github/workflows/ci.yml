name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras only)
        # The heavy ML extras (sapbert/biolord) are intentionally skipped:
        # sentence-transformers is imported lazily and the suite mocks the
        # models, so the non-integration tests run without that ~1.3 GB stack.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (non-integration)
        # Integration tests hit live external APIs (ClinicalTrials.gov, Anthropic,
        # …) and need credentials, so they are excluded from CI.
        run: pytest -m "not integration" -q
