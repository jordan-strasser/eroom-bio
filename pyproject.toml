[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eroom"
version = "0.2.0"
description = "Open knowledge system that learns from clinical trials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "httpx",
    "anthropic",
    "pypdf>=4.0",
    "scipy",
    "numpy",
    "fastapi",
    "uvicorn",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
# Round-21: compound canonicalization via SapBERT embeddings. Pulls in
# ~1.3 GB of ML deps (sentence-transformers + transformers + CPU-only
# torch). Install with `pip install -e ".[sapbert]"` to enable the
# embedding-based dedup path in src/graph/sapbert_embeddings.py. The
# SapBERT model weights (~440 MB) download to ~/.cache/huggingface on
# first use. Without this extra, InterventionNode's stable_id +
# embedding fields stay None and canonicalization falls back to the
# curated CODENAME_TO_INN + slug-based behavior.
sapbert = [
    "sentence-transformers>=2.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit external APIs",
]
